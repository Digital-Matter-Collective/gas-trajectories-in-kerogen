name: kerogen

# Reference environment for publication calculations.
# Tested on Ubuntu x86_64; exact direct versions mirror the author's
# /home/andrey/anaconda3/envs/kerogen environment on 2026-09-01.
channels:
  - defaults
  - conda-forge

# The reference env mixes defaults scientific/MKL builds with conda-forge
# Python and VTK. Create it with CONDA_CHANNEL_PRIORITY=flexible as shown in
# README.md; this does not change the user's global Conda configuration.

dependencies:
  - conda-forge::python=3.14.4=habeac84_100_cp314
  - defaults::pip=25.3=pyh0d26453_0
  - defaults::setuptools=80.9.0=py314h06a4308_0

  # Keep the numerical backend used for the reference calculations.
  - defaults::blas=1.0=mkl
  - defaults::intel-openmp=2025.0.0=h06a4308_1171
  - defaults::mkl=2025.0.0=hacee8c2_941
  - defaults::mkl-service=2.5.2=py314hacdc0fc_0
  - defaults::mkl_fft=2.1.1=py314h2be417e_0
  - defaults::mkl_random=1.3.0=py314hda4e5d8_0

  # Direct runtime dependencies imported by the project.
  - defaults::joblib=1.5.3=py314h06a4308_0
  - defaults::matplotlib=3.10.8=py314h06a4308_0
  - defaults::networkx=3.6.1=py314h06a4308_0
  - defaults::numba=0.63.1=py314h45d1962_0
  - defaults::numpy=2.3.5=py314hc4ca38b_0
  - defaults::pandas=2.3.3=py314hda4e5d8_1
  - defaults::scikit-image=0.26.0=py314h7354ed3_0
  - defaults::scikit-learn=1.8.0=py314h973aee8_0
  - defaults::scipy=1.16.3=py314h3d0cd3c_0
  - defaults::seaborn=0.13.2=py314h06a4308_3

  # Optional interactive/offscreen 3-D visualization support.
  - conda-forge::vtk=9.6.2=py314hd5da0b9_2

  # pytest 9.0.3 is installed from PyPI in the reference environment.
  # ruff/isort/black/mypy are the dev tools run by prepare.sh/tools/check.sh
  # (and CI); pinned here so local runs and CI use identical versions -
  # verify/adjust these pins if they drift from what you actually use.
  # Installing the project editable also exposes all console scripts.
  - pip:
      - pytest==9.0.3
      - ruff==0.15.1
      - isort==7.0.0
      - black==25.11.0
      - mypy==1.18.2
      - -e .[visualization]
